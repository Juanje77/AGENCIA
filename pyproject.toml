[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agencia-viajes"
version = "1.0.0"
description = "Cotizador de viajes y lector de facturas de mayoristas que liquida IVA e Ingresos Brutos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["turismo", "agencia de viajes", "iva", "ingresos brutos", "facturas", "arca", "afip"]
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
excel = ["openpyxl>=3.1"]
ia = ["anthropic>=0.40"]
ocr = ["pytesseract>=0.3", "pillow>=10.0", "pymupdf>=1.24"]
todo = [
    "pymupdf>=1.24", "openpyxl>=3.1", "anthropic>=0.40",
    "pytesseract>=0.3", "pillow>=10.0",
]
dev = ["pytest>=7.0", "pymupdf>=1.24", "openpyxl>=3.1", "anthropic>=0.40"]

[project.scripts]
agencia = "agencia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agencia = ["web/estatico/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
